  description: "DexGuard runtime + obfuscation — commercial RASP."

- id: mtd-guardsquare-proguard-mapping
  name: "Guardsquare ProGuard enterprise"
  category: mtd_rasp
  severity: low
  evidence_location: dex_string
  patterns:
    - "proguard.MapClassLoader"
  description: "ProGuard enterprise runtime mapping (low-confidence signal)."

- id: mtd-verimatrix
  name: "Verimatrix Application Protection"
  category: mtd_rasp
  severity: critical
  evidence_location: native_lib_name
  patterns:
    - "libvkey"
    - "libvcypher"
