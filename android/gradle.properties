# ─── AndroidX ────────────────────────────────────────────────────────────
# Required: project uses AndroidX (Compose, Room, Lifecycle, Navigation,
# DocumentFile, core-ktx). Without this flag, AGP aborts at
# :app:checkDebugAarMetadata with "contains AndroidX dependencies, but the
# android.useAndroidX property is not enabled".
android.useAndroidX=true

# Non-transitive R classes: faster build, smaller R class per module.
android.nonTransitiveRClass=true

# ─── Gradle daemon ───────────────────────────────────────────────────────
# Heap sized for CI runners (2 GB is the GitHub Actions default).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build performance.
org.gradle.parallel=true
org.gradle.caching=true

# ─── Kotlin ──────────────────────────────────────────────────────────────
kotlin.code.style=official
